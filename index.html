<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD 后端面试 · 刷题</title>
    <!-- 使用更优雅的字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* --- 全局重置与基调 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fb;
            color: #1e1e1e;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 56px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            height: fit-content;
        }

        /* --- 头部 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress {
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            background: #f3f4f6;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 40px;
        }

        .mode-btn {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .mode-btn.active {
            background: #ffffff;
            color: #111827;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .mode-btn:hover:not(.active) {
            color: #111827;
        }

        .controls {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #4b5563;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .btn-primary {
            background: #111827;
            color: white;
        }

        .btn-primary:hover {
            background: #374151;
        }

        /* --- 搜索框 --- */
        .search-box {
            margin-bottom: 32px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            background: #fafafa;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
            color: #1f2937;
        }

        .search-box input:focus {
            outline: none;
            border-color: #9ca3af;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .search-box input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        /* --- 题目卡片 --- */
        .question {
            margin-bottom: 32px;
        }

        .question h2 {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
            line-height: 1.4;
        }

        .card {
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            background: #fcfcfd;
            transition: border 0.2s;
        }

        .card:hover {
            border-color: #e5e7eb;
        }

        .card-header {
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 14px;
            color: #4b5563;
            transition: background 0.15s;
        }

        .card-header:hover {
            background: #f8f9fa;
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        .arrow {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
            color: #9ca3af;
        }

        .arrow.open {
            transform: rotate(90deg);
        }

        .card-body {
            padding: 0 20px 20px 20px;
            display: none;
            color: #374151;
            font-size: 14px;
            line-height: 1.7;
        }

        .card-body.show {
            display: block;
            animation: fadeSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-text, .explanation-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .explanation-text {
            color: #4b5563;
            font-size: 13.5px;
            background: #f9fafb;
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 3px solid #d1d5db;
        }

        /* --- 底部导航 --- */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 24px;
            border-top: 1px solid #f3f4f6;
        }

        .bottom-nav .btn {
            padding: 10px 20px;
        }

        /* --- 响应式 --- */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }
            .container {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .controls {
                justify-content: space-between;
            }
            .question h2 {
                font-size: 17px;
            }
            .card-header {
                padding: 14px 16px;
                font-size: 13px;
            }
            .card-body {
                padding: 0 16px 16px 16px;
                font-size: 13px;
            }
            .bottom-nav {
                flex-direction: column;
                gap: 8px;
            }
            .bottom-nav .btn {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            .mode-toggle {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <div class="progress" id="progress">1 / 162</div>
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="quiz">刷题模式</button>
                    <button class="mode-btn" data-mode="read">阅读模式</button>
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="prevBtn">← 上一题</button>
                <button class="btn btn-primary" id="nextBtn">下一题 →</button>
                <button class="btn" id="randomBtn">🎲 随机</button>
            </div>
        </div>

        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索题目、答案或解析..." />
        </div>

        <!-- 题目区域 -->
        <div class="question" id="questionContainer"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <button class="btn" id="prevBtnBottom">← 上一题</button>
            <button class="btn btn-primary" id="nextBtnBottom">下一题 →</button>
        </div>
    </div>

    <script src="./questions.js"></script>
    <script>
        (function() {
            // --- 数据初始化 ---
            if (typeof questions === 'undefined') {
                console.error('questions.js 未加载或 questions 变量不存在');
                return;
            }
            // 按 id 排序
            questions.sort((a, b) => a.id - b.id);

            let currentIndex = 0;
            let currentMode = 'quiz'; // 'quiz' 或 'read'

            // --- DOM 引用 ---
            const container = document.getElementById('questionContainer');
            const progress = document.getElementById('progress');
            const searchInput = document.getElementById('searchInput');
            const modeBtns = document.querySelectorAll('.mode-btn');

            // --- 工具函数 ---
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }

            // --- 渲染当前题目 ---
            function renderQuestion() {
                if (!questions || questions.length === 0) {
                    container.innerHTML = '<p style="color: #6b7280;">暂无题目数据</p>';
                    return;
                }
                const q = questions[currentIndex];
                // 根据模式决定是否默认展开
                const isReadMode = (currentMode === 'read');
                // 答案卡片
                const answerShow = isReadMode ? 'show' : '';
                const answerArrow = isReadMode ? 'open' : '';
                // 解析卡片
                const explanationShow = isReadMode ? 'show' : '';
                const explanationArrow = isReadMode ? 'open' : '';

                container.innerHTML = `
                    <h2>${q.id}. ${escapeHtml(q.question)}</h2>
                    <div class="card">
                        <div class="card-header" data-target="answer">
                            <h3>📖 答案</h3>
                            <span class="arrow ${answerArrow}">▶</span>
                        </div>
                        <div class="card-body ${answerShow}" data-body="answer">
                            <div class="answer-text">${escapeHtml(q.answer)}</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header" data-target="explanation">
                            <h3>🔍 解析</h3>
                            <span class="arrow ${explanationArrow}">▶</span>
                        </div>
                        <div class="card-body ${explanationShow}" data-body="explanation">
                            <div class="explanation-text">${escapeHtml(q.explanation || '暂无解析')}</div>
                        </div>
                    </div>
                `;

                // 更新进度
                progress.textContent = `${currentIndex + 1} / ${questions.length}`;

                // 绑定卡片点击事件（委托方式）
                container.querySelectorAll('.card-header').forEach(header => {
                    header.addEventListener('click', function(e) {
                        // 切换当前卡片的展开/折叠
                        const body = this.nextElementSibling;
                        const arrow = this.querySelector('.arrow');
                        if (body) {
                            body.classList.toggle('show');
                            arrow.classList.toggle('open');
                        }
                    });
                });
            }

            // --- 切换模式 ---
            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;
                // 更新按钮样式
                modeBtns.forEach(btn => {
                    const m = btn.dataset.mode;
                    if (m === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                // 重新渲染当前题目（会应用新的默认展开状态）
                renderQuestion();
            }

            // --- 导航函数 ---
            function prevQuestion() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            }

            function nextQuestion() {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                }
            }

            function randomQuestion() {
                const randomIndex = Math.floor(Math.random() * questions.length);
                currentIndex = randomIndex;
                renderQuestion();
            }

            // --- 搜索功能 ---
            function handleSearch(keyword) {
                const trimmed = keyword.trim().toLowerCase();
                if (trimmed === '') {
                    // 如果清空搜索，回到第一题（或保留当前？这里回到第一题）
                    currentIndex = 0;
                    renderQuestion();
                    return;
                }
                const results = questions.filter(q =>
                    q.question.toLowerCase().includes(trimmed) ||
                    (q.answer && q.answer.toLowerCase().includes(trimmed)) ||
                    (q.explanation && q.explanation.toLowerCase().includes(trimmed))
                );
                if (results.length > 0) {
                    const idx = questions.indexOf(results[0]);
                    currentIndex = idx;
                    renderQuestion();
                }
                // 若无结果，保持当前
            }

            // --- 事件绑定 ---
            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    setMode(mode);
                });
            });

            // 按钮事件（上下、随机）
            document.getElementById('prevBtn').addEventListener('click', prevQuestion);
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            document.getElementById('randomBtn').addEventListener('click', randomQuestion);
            document.getElementById('prevBtnBottom').addEventListener('click', prevQuestion);
            document.getElementById('nextBtnBottom').addEventListener('click', nextQuestion);

            // 搜索输入
            searchInput.addEventListener('input', function(e) {
                handleSearch(this.value);
            });

            // 键盘快捷键（左右箭头翻页，排除输入框）
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevQuestion();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextQuestion();
                }
            });

            // --- 初始化 ---
            // 默认刷题模式
            setMode('quiz');
            renderQuestion();
        })();
    </script>
</body>
</html>
