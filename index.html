<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD 后端面试 · 刷题</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* --- CSS 变量（主题） --- */
        :root {
            --bg-body: #f8f9fb;
            --bg-container: #ffffff;
            --bg-card: #fcfcfd;
            --bg-card-hover: #f8f9fa;
            --bg-progress: #f3f4f6;
            --bg-mode-toggle: #f3f4f6;
            --bg-mode-btn-active: #ffffff;
            --bg-search: #fafafa;
            --bg-search-focus: #ffffff;
            --bg-explanation: #f9fafb;
            --border-container: rgba(0, 0, 0, 0.04);
            --border-card: #f0f0f0;
            --border-card-hover: #e5e7eb;
            --border-search: #e5e7eb;
            --border-explanation: #d1d5db;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-light: #4b5563;
            --text-white: #ffffff;
            --shadow-container: 0 4px 24px rgba(0, 0, 0, 0.04);
            --shadow-mode-btn: 0 1px 4px rgba(0, 0, 0, 0.08);
            --btn-hover-bg: #f3f4f6;
            --btn-primary-bg: #111827;
            --btn-primary-hover: #374151;
            --btn-primary-text: #ffffff;
            --arrow-color: #9ca3af;
            --input-focus-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-body: #0a0a0a;
            --bg-container: #141414;
            --bg-card: #1a1a1a;
            --bg-card-hover: #242424;
            --bg-progress: #2a2a2a;
            --bg-mode-toggle: #2a2a2a;
            --bg-mode-btn-active: #3a3a3a;
            --bg-search: #1a1a1a;
            --bg-search-focus: #242424;
            --bg-explanation: #1f1f1f;
            --border-container: rgba(255, 255, 255, 0.06);
            --border-card: #2a2a2a;
            --border-card-hover: #3a3a3a;
            --border-search: #2a2a2a;
            --border-explanation: #3a3a3a;
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --text-light: #9ca3af;
            --shadow-container: 0 4px 24px rgba(0, 0, 0, 0.6);
            --shadow-mode-btn: 0 1px 4px rgba(0, 0, 0, 0.4);
            --btn-hover-bg: #2a2a2a;
            --btn-primary-bg: #f3f4f6;
            --btn-primary-hover: #ffffff;
            --btn-primary-text: #111827;
            --arrow-color: #6b7280;
            --input-focus-shadow: 0 2px 8px rgba(255, 255, 255, 0.04);
        }

        /* --- 全局样式 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: var(--bg-container);
            border-radius: 24px;
            padding: 48px 56px;
            box-shadow: var(--shadow-container);
            border: 1px solid var(--border-container);
            height: fit-content;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- 头部 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .progress {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-progress);
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            transition: background-color 0.3s, color 0.3s;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            background: var(--bg-mode-toggle);
            padding: 4px;
            border-radius: 40px;
            transition: background-color 0.3s;
        }

        .mode-btn {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .mode-btn.active {
            background: var(--bg-mode-btn-active);
            color: var(--text-primary);
            box-shadow: var(--shadow-mode-btn);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-light);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }

        .btn-primary:hover {
            background: var(--btn-primary-hover);
        }

        /* 主题切换按钮（太阳/月亮） */
        .theme-toggle {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.2s, transform 0.2s;
            line-height: 1;
            color: var(--text-muted);
        }

        .theme-toggle:hover {
            background: var(--btn-hover-bg);
            transform: scale(1.05);
        }

        /* --- 搜索框 --- */
        .search-box {
            margin-bottom: 32px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--border-search);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-search);
            transition: border 0.2s, box-shadow 0.2s, background 0.3s;
            font-family: inherit;
            color: var(--text-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: #9ca3af;
            background: var(--bg-search-focus);
            box-shadow: var(--input-focus-shadow);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* --- 题目卡片 --- */
        .question {
            margin-bottom: 32px;
        }

        .question h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            letter-spacing: -0.3px;
            line-height: 1.4;
            transition: color 0.3s;
        }

        .card {
            border: 1px solid var(--border-card);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--bg-card);
            transition: border-color 0.2s, background 0.3s;
        }

        .card:hover {
            border-color: var(--border-card-hover);
        }

        .card-header {
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-light);
            transition: background 0.15s, color 0.3s;
        }

        .card-header:hover {
            background: var(--bg-card-hover);
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        .arrow {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
            color: var(--arrow-color);
        }

        .arrow.open {
            transform: rotate(90deg);
        }

        .card-body {
            padding: 0 20px 20px 20px;
            display: none;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
            transition: color 0.3s;
        }

        .card-body.show {
            display: block;
            animation: fadeSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-text,
        .explanation-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .explanation-text {
            color: var(--text-secondary);
            font-size: 13.5px;
            background: var(--bg-explanation);
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 3px solid var(--border-explanation);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        /* --- 底部导航 --- */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 24px;
            border-top: 1px solid var(--border-card);
            transition: border-color 0.3s;
        }

        .bottom-nav .btn {
            padding: 10px 20px;
        }

        /* --- 响应式 --- */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }
            .container {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .controls {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .question h2 {
                font-size: 17px;
            }
            .card-header {
                padding: 14px 16px;
                font-size: 13px;
            }
            .card-body {
                padding: 0 16px 16px 16px;
                font-size: 13px;
            }
            .bottom-nav {
                flex-direction: column;
                gap: 8px;
            }
            .bottom-nav .btn {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            .mode-toggle {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <div class="progress" id="progress">1 / 162</div>
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="quiz">刷题模式</button>
                    <button class="mode-btn" data-mode="read">阅读模式</button>
                </div>
            </div>
            <div class="controls">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>
                <button class="btn" id="prevBtn">← 上一题</button>
                <button class="btn btn-primary" id="nextBtn">下一题 →</button>
                <button class="btn" id="randomBtn">🎲 随机</button>
            </div>
        </div>

        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索题目、答案或解析..." />
        </div>

        <!-- 题目区域 -->
        <div class="question" id="questionContainer"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <button class="btn" id="prevBtnBottom">← 上一题</button>
            <button class="btn btn-primary" id="nextBtnBottom">下一题 →</button>
        </div>
    </div>

    <script src="./questions.js"></script>
    <script>
        (function() {
            // --- 数据初始化 ---
            if (typeof questions === 'undefined') {
                console.error('questions.js 未加载或 questions 变量不存在');
                return;
            }
            questions.sort((a, b) => a.id - b.id);

            let currentIndex = 0;
            let currentMode = 'quiz'; // 'quiz' 或 'read'
            let currentTheme = 'light'; // 'light' 或 'dark'

            // --- DOM 引用 ---
            const container = document.getElementById('questionContainer');
            const progress = document.getElementById('progress');
            const searchInput = document.getElementById('searchInput');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const themeToggle = document.getElementById('themeToggle');

            // --- 工具函数 ---
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }

            // --- 渲染当前题目 ---
            function renderQuestion() {
                if (!questions || questions.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">暂无题目数据</p>';
                    return;
                }
                const q = questions[currentIndex];
                const isReadMode = (currentMode === 'read');
                const answerShow = isReadMode ? 'show' : '';
                const answerArrow = isReadMode ? 'open' : '';
                const explanationShow = isReadMode ? 'show' : '';
                const explanationArrow = isReadMode ? 'open' : '';

                container.innerHTML = `
                    <h2>${q.id}. ${escapeHtml(q.question)}</h2>
                    <div class="card">
                        <div class="card-header" data-target="answer">
                            <h3>📖 答案</h3>
                            <span class="arrow ${answerArrow}">▶</span>
                        </div>
                        <div class="card-body ${answerShow}" data-body="answer">
                            <div class="answer-text">${escapeHtml(q.answer)}</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header" data-target="explanation">
                            <h3>🔍 解析</h3>
                            <span class="arrow ${explanationArrow}">▶</span>
                        </div>
                        <div class="card-body ${explanationShow}" data-body="explanation">
                            <div class="explanation-text">${escapeHtml(q.explanation || '暂无解析')}</div>
                        </div>
                    </div>
                `;

                progress.textContent = `${currentIndex + 1} / ${questions.length}`;

                // 绑定卡片点击事件
                container.querySelectorAll('.card-header').forEach(header => {
                    header.addEventListener('click', function(e) {
                        const body = this.nextElementSibling;
                        const arrow = this.querySelector('.arrow');
                        if (body) {
                            body.classList.toggle('show');
                            arrow.classList.toggle('open');
                        }
                    });
                });
            }

            // --- 模式切换 ---
            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;
                modeBtns.forEach(btn => {
                    const m = btn.dataset.mode;
                    if (m === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                renderQuestion();
            }

            // --- 主题切换 ---
            function setTheme(theme) {
                if (theme === currentTheme) return;
                currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
                themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
                localStorage.setItem('pd-theme', theme);
            }

            function toggleTheme() {
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
            }

            // 从 localStorage 恢复主题
            function loadTheme() {
                const stored = localStorage.getItem('pd-theme');
                if (stored === 'dark') {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }
            }

            // --- 导航函数 ---
            function prevQuestion() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            }

            function nextQuestion() {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                }
            }

            function randomQuestion() {
                const randomIndex = Math.floor(Math.random() * questions.length);
                currentIndex = randomIndex;
                renderQuestion();
            }

            // --- 搜索功能 ---
            function handleSearch(keyword) {
                const trimmed = keyword.trim().toLowerCase();
                if (trimmed === '') {
                    currentIndex = 0;
                    renderQuestion();
                    return;
                }
                const results = questions.filter(q =>
                    q.question.toLowerCase().includes(trimmed) ||
                    (q.answer && q.answer.toLowerCase().includes(trimmed)) ||
                    (q.explanation && q.explanation.toLowerCase().includes(trimmed))
                );
                if (results.length > 0) {
                    const idx = questions.indexOf(results[0]);
                    currentIndex = idx;
                    renderQuestion();
                }
            }

            // --- 事件绑定 ---
            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    setMode(mode);
                });
            });

            // 主题切换
            themeToggle.addEventListener('click', toggleTheme);

            // 按钮事件
            document.getElementById('prevBtn').addEventListener('click', prevQuestion);
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            document.getElementById('randomBtn').addEventListener('click', randomQuestion);
            document.getElementById('prevBtnBottom').addEventListener('click', prevQuestion);
            document.getElementById('nextBtnBottom').addEventListener('click', nextQuestion);

            // 搜索
            searchInput.addEventListener('input', function(e) {
                handleSearch(this.value);
            });

            // 键盘
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevQuestion();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextQuestion();
                }
            });

            // --- 初始化 ---
            loadTheme();      // 恢复主题
            setMode('quiz');  // 默认刷题模式
            renderQuestion();
        })();
    </script>
</body>
</html>
