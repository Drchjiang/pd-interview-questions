<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD 后端面试 · 刷题</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* --- CSS 变量（主题） --- */
        :root {
            --bg-body: #f8f9fb;
            --bg-container: #ffffff;
            --bg-card: #fcfcfd;
            --bg-card-hover: #f8f9fa;
            --bg-progress: #f3f4f6;
            --bg-mode-toggle: #f3f4f6;
            --bg-mode-btn-active: #ffffff;
            --bg-search: #fafafa;
            --bg-search-focus: #ffffff;
            --bg-explanation: #f9fafb;
            --border-container: rgba(0, 0, 0, 0.04);
            --border-card: #f0f0f0;
            --border-card-hover: #e5e7eb;
            --border-search: #e5e7eb;
            --border-explanation: #d1d5db;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-light: #4b5563;
            --shadow-container: 0 4px 24px rgba(0, 0, 0, 0.04);
            --shadow-mode-btn: 0 1px 4px rgba(0, 0, 0, 0.08);
            --btn-hover-bg: #f3f4f6;
            --btn-primary-bg: #111827;
            --btn-primary-hover: #374151;
            --btn-primary-text: #ffffff;
            --arrow-color: #9ca3af;
            --input-focus-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            --social-bg: #f3f4f6;
            --social-text: #4b5563;
            --favorite-color: #f59e0b;
            --favorite-bg: #fef3c7;
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-body: #0a0a0a;
            --bg-container: #141414;
            --bg-card: #1a1a1a;
            --bg-card-hover: #242424;
            --bg-progress: #2a2a2a;
            --bg-mode-toggle: #2a2a2a;
            --bg-mode-btn-active: #3a3a3a;
            --bg-search: #1a1a1a;
            --bg-search-focus: #242424;
            --bg-explanation: #1f1f1f;
            --border-container: rgba(255, 255, 255, 0.06);
            --border-card: #2a2a2a;
            --border-card-hover: #3a3a3a;
            --border-search: #2a2a2a;
            --border-explanation: #3a3a3a;
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --text-light: #9ca3af;
            --shadow-container: 0 4px 24px rgba(0, 0, 0, 0.6);
            --shadow-mode-btn: 0 1px 4px rgba(0, 0, 0, 0.4);
            --btn-hover-bg: #2a2a2a;
            --btn-primary-bg: #f3f4f6;
            --btn-primary-hover: #ffffff;
            --btn-primary-text: #111827;
            --arrow-color: #6b7280;
            --input-focus-shadow: 0 2px 8px rgba(255, 255, 255, 0.04);
            --social-bg: #2a2a2a;
            --social-text: #9ca3af;
            --favorite-color: #fbbf24;
            --favorite-bg: #2a1f0a;
        }

        /* --- 全局样式 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: var(--bg-container);
            border-radius: 24px;
            padding: 48px 56px;
            box-shadow: var(--shadow-container);
            border: 1px solid var(--border-container);
            height: fit-content;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- 头部 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .progress {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-progress);
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            transition: background-color 0.3s, color 0.3s;
        }

        .mode-toggle {
            display: flex;
            gap: 4px;
            background: var(--bg-mode-toggle);
            padding: 4px;
            border-radius: 40px;
            transition: background-color 0.3s;
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .mode-btn.active {
            background: var(--bg-mode-btn-active);
            color: var(--text-primary);
            box-shadow: var(--shadow-mode-btn);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-light);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }

        .btn-primary:hover {
            background: var(--btn-primary-hover);
        }

        .btn-fav-filter {
            background: transparent;
            border: 1px solid var(--border-card);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-fav-filter.active {
            background: var(--favorite-color);
            color: #fff;
            border-color: var(--favorite-color);
        }

        .btn-fav-filter:hover:not(.active) {
            border-color: var(--text-muted);
        }

        .theme-toggle {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.2s, transform 0.2s;
            line-height: 1;
            color: var(--text-muted);
        }

        .theme-toggle:hover {
            background: var(--btn-hover-bg);
            transform: scale(1.05);
        }

        /* --- 搜索框 --- */
        .search-box {
            margin-bottom: 32px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--border-search);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-search);
            transition: border 0.2s, box-shadow 0.2s, background 0.3s;
            font-family: inherit;
            color: var(--text-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: #9ca3af;
            background: var(--bg-search-focus);
            box-shadow: var(--input-focus-shadow);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* --- 题目卡片 --- */
        .question {
            margin-bottom: 32px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            gap: 12px;
        }

        .question-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            line-height: 1.4;
            transition: color 0.3s;
            flex: 1;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.15s;
            line-height: 1;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .fav-btn:hover {
            transform: scale(1.1);
        }

        .fav-btn.active {
            color: var(--favorite-color);
        }

        .card {
            border: 1px solid var(--border-card);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--bg-card);
            transition: border-color 0.2s, background 0.3s;
        }

        .card:hover {
            border-color: var(--border-card-hover);
        }

        .card-header {
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-light);
            transition: background 0.15s, color 0.3s;
        }

        .card-header:hover {
            background: var(--bg-card-hover);
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        .arrow {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
            color: var(--arrow-color);
        }

        .arrow.open {
            transform: rotate(90deg);
        }

        .card-body {
            padding: 0 20px 20px 20px;
            display: none;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
            transition: color 0.3s;
        }

        .card-body.show {
            display: block;
            animation: fadeSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-text,
        .explanation-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .explanation-text {
            color: var(--text-secondary);
            font-size: 13.5px;
            background: var(--bg-explanation);
            padding: 16px 20px;
            border-radius: 12px;
            border-left: 3px solid var(--border-explanation);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        /* --- 底部导航 --- */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 24px;
            border-top: 1px solid var(--border-card);
            transition: border-color 0.3s;
        }

        .bottom-nav .btn {
            padding: 10px 20px;
        }

        .shortcut-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            letter-spacing: 0.3px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .shortcut-hint:hover {
            opacity: 1;
        }

        /* --- 社交链接 --- */
        .social-links {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-card);
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: border-color 0.3s;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
            background: var(--social-bg);
            color: var(--social-text);
            border: 1px solid var(--border-card);
            line-height: 1.4;
        }

        .social-link:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .social-link.bilibili {
            background: #00a1d6;
            color: white;
            border-color: #00a1d6;
        }

        .social-link.xiaohongshu {
            background: #ff2442;
            color: white;
            border-color: #ff2442;
        }

        .social-link .icon {
            font-size: 14px;
            line-height: 1;
        }

        /* --- 响应式 --- */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }
            .container {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .controls {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .question-header {
                flex-wrap: wrap;
            }
            .question-header h2 {
                font-size: 17px;
            }
            .card-header {
                padding: 14px 16px;
                font-size: 13px;
            }
            .card-body {
                padding: 0 16px 16px 16px;
                font-size: 13px;
            }
            .bottom-nav {
                flex-direction: column;
                gap: 8px;
            }
            .bottom-nav .btn {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            .mode-toggle {
                width: 100%;
                justify-content: center;
            }
            .social-links {
                gap: 10px;
            }
            .social-link {
                padding: 4px 12px;
                font-size: 11px;
            }
            .social-link .icon {
                font-size: 12px;
            }
            .btn-fav-filter {
                font-size: 12px;
                padding: 2px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <div class="progress" id="progress">1 / 162</div>
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="quiz">刷题</button>
                    <button class="mode-btn" data-mode="read">阅读</button>
                    <button class="mode-btn" data-mode="random">随机</button>
                </div>
                <button class="btn-fav-filter" id="favFilterBtn">⭐ 收藏</button>
            </div>
            <div class="controls">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>
                <button class="btn" id="prevBtn">← 上一题</button>
                <button class="btn btn-primary" id="nextBtn">下一题 →</button>
                <button class="btn" id="randomBtn">🎲 随机</button>
            </div>
        </div>

        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索题目、答案或解析..." />
        </div>

        <!-- 题目区域 -->
        <div class="question" id="questionContainer"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <button class="btn" id="prevBtnBottom">← 上一题</button>
            <button class="btn btn-primary" id="nextBtnBottom">下一题 →</button>
        </div>
        <div class="shortcut-hint">←  →  方向键翻页</div>

        <!-- 社交链接 -->
        <div class="social-links">
            <a href="#" class="social-link bilibili" id="biliLink" target="_blank">
                <span class="icon">🔵</span> B站 · 当时只道是-寻常-
            </a>
            <a href="#" class="social-link xiaohongshu" id="xhsLink" target="_blank">
                <span class="icon">🔴</span> 小红书 · 寻常小店
            </a>
        </div>
    </div>

    <script src="./questions.js"></script>
    <script>
        (function() {
            // ========== 配置区 ==========
            const BILI_UID = '390423616';
            const XHS_USER_ID = '5f4667a5000000000100710b';
            // =============================

            // --- 数据初始化 ---
            if (typeof questions === 'undefined') {
                console.error('questions.js 未加载或 questions 变量不存在');
                return;
            }
            questions.sort((a, b) => a.id - b.id);
            const total = questions.length;

            // --- 状态 ---
            let currentIndex = 0;
            let currentMode = 'quiz';      // 'quiz' | 'read' | 'random'
            let currentTheme = 'light';
            let sequentialIndex = 0;        // 顺序模式下的索引，用于切换回顺序
            let favorites = new Set();      // 存储收藏的题目 id
            let isFavFilterActive = false;  // 是否只看收藏

            // --- DOM 引用 ---
            const container = document.getElementById('questionContainer');
            const progress = document.getElementById('progress');
            const searchInput = document.getElementById('searchInput');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const themeToggle = document.getElementById('themeToggle');
            const favFilterBtn = document.getElementById('favFilterBtn');
            const biliLink = document.getElementById('biliLink');
            const xhsLink = document.getElementById('xhsLink');

            // --- 工具函数 ---
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }

            // --- 收藏操作 ---
            function loadFavorites() {
                try {
                    const stored = localStorage.getItem('pd-favorites');
                    if (stored) {
                        const arr = JSON.parse(stored);
                        favorites = new Set(arr);
                    }
                } catch (e) {}
            }

            function saveFavorites() {
                localStorage.setItem('pd-favorites', JSON.stringify([...favorites]));
            }

            function toggleFavorite(id) {
                if (favorites.has(id)) {
                    favorites.delete(id);
                } else {
                    favorites.add(id);
                }
                saveFavorites();
                // 重新渲染当前题目（更新星标状态）
                renderQuestion();
                // 如果收藏筛选激活，可能需要重新筛选列表，但这里保持简单，只刷新显示
                if (isFavFilterActive) {
                    // 如果当前收藏筛选激活，但移除收藏后可能无题，我们让 render 处理空状态
                    renderQuestion(); // 但 renderQuestion 会基于 currentIndex 渲染，如果当前题被取消收藏且筛选激活，应该跳转
                    // 更好的是在 render 中处理，但为了简单，我们在取消收藏时如果筛选激活，检查当前题是否还在收藏中，不在则跳到第一个收藏
                    if (isFavFilterActive && !favorites.has(questions[currentIndex].id)) {
                        // 跳到第一个收藏
                        const favIds = [...favorites];
                        if (favIds.length > 0) {
                            const firstFav = questions.find(q => favIds.includes(q.id));
                            if (firstFav) {
                                currentIndex = questions.indexOf(firstFav);
                                renderQuestion();
                            } else {
                                // 没有收藏，显示空状态
                                renderQuestion();
                            }
                        } else {
                            renderQuestion();
                        }
                    }
                }
            }

            // --- 进度记忆 ---
            function saveProgress(index) {
                localStorage.setItem('pd-progress', String(index));
            }

            function loadProgress() {
                const stored = localStorage.getItem('pd-progress');
                if (stored !== null) {
                    const idx = parseInt(stored, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < total) {
                        return idx;
                    }
                }
                return 0;
            }

            // --- 设置社交链接 ---
            function setupSocialLinks() {
                if (BILI_UID) {
                    biliLink.href = `https://space.bilibili.com/${BILI_UID}`;
                }
                if (XHS_USER_ID) {
                    xhsLink.href = `https://www.xiaohongshu.com/user/profile/${XHS_USER_ID}`;
                }
            }

            // --- 获取当前有效题目列表（考虑收藏筛选） ---
            function getCurrentQuestions() {
                if (isFavFilterActive) {
                    return questions.filter(q => favorites.has(q.id));
                }
                return questions;
            }

            // --- 渲染当前题目 ---
            function renderQuestion() {
                const currentQuestions = getCurrentQuestions();
                if (currentQuestions.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:40px 0;color:var(--text-muted);">
                            <p style="font-size:18px;margin-bottom:8px;">📭 暂无收藏题目</p>
                            <p style="font-size:14px;">点击题目旁的 ☆ 即可收藏</p>
                        </div>
                    `;
                    progress.textContent = `0 / 0`;
                    return;
                }

                // 确保 currentIndex 在有效范围内
                if (currentIndex >= currentQuestions.length) {
                    currentIndex = currentQuestions.length - 1;
                }
                if (currentIndex < 0) currentIndex = 0;

                const q = currentQuestions[currentIndex];
                const realId = q.id; // 原题 id

                const isReadMode = (currentMode === 'read');
                // 随机模式下强制折叠（刷题模式）
                const isRandomMode = (currentMode === 'random');
                const defaultExpanded = (isReadMode && !isRandomMode);
                const answerShow = defaultExpanded ? 'show' : '';
                const answerArrow = defaultExpanded ? 'open' : '';
                const explanationShow = defaultExpanded ? 'show' : '';
                const explanationArrow = defaultExpanded ? 'open' : '';

                const isFav = favorites.has(realId);

                container.innerHTML = `
                    <div class="question-header">
                        <h2>${q.id}. ${escapeHtml(q.question)}</h2>
                        <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${q.id}" aria-label="收藏">${isFav ? '★' : '☆'}</button>
                    </div>
                    <div class="card">
                        <div class="card-header" data-target="answer">
                            <h3>📖 答案</h3>
                            <span class="arrow ${answerArrow}">▶</span>
                        </div>
                        <div class="card-body ${answerShow}" data-body="answer">
                            <div class="answer-text">${escapeHtml(q.answer)}</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header" data-target="explanation">
                            <h3>🔍 解析</h3>
                            <span class="arrow ${explanationArrow}">▶</span>
                        </div>
                        <div class="card-body ${explanationShow}" data-body="explanation">
                            <div class="explanation-text">${escapeHtml(q.explanation || '暂无解析')}</div>
                        </div>
                    </div>
                `;

                progress.textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
                // 保存进度（只保存顺序模式下的索引，随机模式下保存顺序索引）
                if (currentMode !== 'random') {
                    saveProgress(currentIndex);
                }

                // 绑定收藏按钮事件
                const favBtn = container.querySelector('.fav-btn');
                if (favBtn) {
                    favBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id, 10);
                        toggleFavorite(id);
                    });
                }

                // 绑定卡片点击事件
                container.querySelectorAll('.card-header').forEach(header => {
                    header.addEventListener('click', function(e) {
                        const body = this.nextElementSibling;
                        const arrow = this.querySelector('.arrow');
                        if (body) {
                            body.classList.toggle('show');
                            arrow.classList.toggle('open');
                        }
                    });
                });

                // 更新收藏筛选按钮状态
                favFilterBtn.classList.toggle('active', isFavFilterActive);
            }

            // --- 模式切换 ---
            function setMode(mode) {
                if (mode === currentMode && mode !== 'random') return;
                // 如果切换到随机模式，保存当前顺序索引
                if (mode === 'random') {
                    sequentialIndex = currentIndex;
                    // 随机选一题
                    const currentQuestions = getCurrentQuestions();
                    if (currentQuestions.length > 0) {
                        const randomIdx = Math.floor(Math.random() * currentQuestions.length);
                        currentIndex = randomIdx;
                    }
                } else {
                    // 从随机切换到顺序，恢复 sequentialIndex
                    if (currentMode === 'random') {
                        // 如果之前是随机模式，恢复到 sequentialIndex
                        const currentQuestions = getCurrentQuestions();
                        if (currentQuestions.length > 0) {
                            const targetIdx = Math.min(sequentialIndex, currentQuestions.length - 1);
                            currentIndex = targetIdx;
                        }
                    }
                }
                currentMode = mode;
                // 更新按钮状态
                modeBtns.forEach(btn => {
                    const m = btn.dataset.mode;
                    if (m === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                // 如果切换到随机模式，保存当前索引为顺序索引？不用，上面已处理
                renderQuestion();
            }

            // --- 主题切换 ---
            function setTheme(theme) {
                if (theme === currentTheme) return;
                currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
                themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
                localStorage.setItem('pd-theme', theme);
            }

            function toggleTheme() {
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
            }

            function loadTheme() {
                const stored = localStorage.getItem('pd-theme');
                if (stored === 'dark') {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }
            }

            // --- 导航函数 ---
            function getNextIndex(delta) {
                const currentQuestions = getCurrentQuestions();
                if (currentQuestions.length === 0) return 0;
                let newIdx = currentIndex + delta;
                if (newIdx < 0) newIdx = currentQuestions.length - 1;
                if (newIdx >= currentQuestions.length) newIdx = 0;
                return newIdx;
            }

            function navigate(delta) {
                if (currentMode === 'random') {
                    // 随机模式：随机跳转
                    const currentQuestions = getCurrentQuestions();
                    if (currentQuestions.length === 0) return;
                    const randomIdx = Math.floor(Math.random() * currentQuestions.length);
                    currentIndex = randomIdx;
                } else {
                    const newIdx = getNextIndex(delta);
                    currentIndex = newIdx;
                }
                renderQuestion();
            }

            function prevQuestion() {
                navigate(-1);
            }

            function nextQuestion() {
                navigate(1);
            }

            function randomQuestion() {
                const currentQuestions = getCurrentQuestions();
                if (currentQuestions.length === 0) return;
                const randomIdx = Math.floor(Math.random() * currentQuestions.length);
                currentIndex = randomIdx;
                renderQuestion();
            }

            // --- 搜索功能 ---
            function handleSearch(keyword) {
                const trimmed = keyword.trim().toLowerCase();
                if (trimmed === '') {
                    // 清空搜索，恢复当前模式下的正常显示
                    // 如果当前是随机模式，保持随机
                    if (currentMode === 'random') {
                        // 随机选一题
                        const currentQuestions = getCurrentQuestions();
                        if (currentQuestions.length > 0) {
                            const randomIdx = Math.floor(Math.random() * currentQuestions.length);
                            currentIndex = randomIdx;
                        }
                    } else {
                        // 回到顺序索引
                        const currentQuestions = getCurrentQuestions();
                        if (currentQuestions.length > 0) {
                            currentIndex = Math.min(sequentialIndex, currentQuestions.length - 1);
                        }
                    }
                    renderQuestion();
                    return;
                }
                // 在所有题目中搜索（忽略收藏筛选）
                const results = questions.filter(q =>
                    q.question.toLowerCase().includes(trimmed) ||
                    (q.answer && q.answer.toLowerCase().includes(trimmed)) ||
                    (q.explanation && q.explanation.toLowerCase().includes(trimmed))
                );
                if (results.length > 0) {
                    // 如果当前有收藏筛选，搜索只在收藏范围内？
                    // 更合理：搜索应该在全题库，但跳转时如果收藏筛选激活，则跳转到收藏中匹配的第一题
                    let targetQuestions = getCurrentQuestions();
                    let targetResult = results.filter(q => targetQuestions.includes(q));
                    if (targetResult.length === 0) {
                        // 如果收藏筛选下没有匹配，则提示
                        alert('未找到匹配的题目');
                        return;
                    }
                    const q = targetResult[0];
                    const idx = targetQuestions.indexOf(q);
                    if (idx !== -1) {
                        currentIndex = idx;
                        renderQuestion();
                    }
                }
            }

            // --- 收藏筛选切换 ---
            function toggleFavFilter() {
                isFavFilterActive = !isFavFilterActive;
                favFilterBtn.classList.toggle('active', isFavFilterActive);
                // 切换后，重置索引到第一个
                const currentQuestions = getCurrentQuestions();
                if (currentQuestions.length > 0) {
                    currentIndex = 0;
                } else {
                    currentIndex = 0;
                }
                renderQuestion();
            }

            // --- 事件绑定 ---
            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    setMode(mode);
                });
            });

            // 主题切换
            themeToggle.addEventListener('click', toggleTheme);

            // 导航
            document.getElementById('prevBtn').addEventListener('click', prevQuestion);
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
            document.getElementById('randomBtn').addEventListener('click', randomQuestion);
            document.getElementById('prevBtnBottom').addEventListener('click', prevQuestion);
            document.getElementById('nextBtnBottom').addEventListener('click', nextQuestion);

            // 收藏筛选
            favFilterBtn.addEventListener('click', toggleFavFilter);

            // 搜索
            searchInput.addEventListener('input', function(e) {
                handleSearch(this.value);
            });

            // 键盘
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevQuestion();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextQuestion();
                }
            });

            // --- 初始化 ---
            loadTheme();
            loadFavorites();
            // 加载进度
            const savedIdx = loadProgress();
            // 默认模式 quiz
            currentMode = 'quiz';
            // 设置按钮高亮
            document.querySelector('.mode-btn[data-mode="quiz"]').classList.add('active');
            // 设置顺序索引
            sequentialIndex = savedIdx;
            currentIndex = savedIdx;
            // 如果收藏筛选默认关闭
            isFavFilterActive = false;
            favFilterBtn.classList.remove('active');
            // 确保索引不越界
            const totalQ = getCurrentQuestions().length;
            if (totalQ > 0 && currentIndex >= totalQ) {
                currentIndex = totalQ - 1;
            }
            renderQuestion();
            setupSocialLinks();
        })();
    </script>
</body>
</html>
